name: yuan
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cupertino_icons: ^2.0.0
  # 图表g库
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  # 图片
  go_router: ^18.1.4
  image_picker: ^1.2.4
  # 国际化
  intl: ^0.20.3
  # 路径管理
  path: ^1.9.1
  path_provider: ^2.1.6
  # 状态管理
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  # 本地数据库
  sqflite: ^2.4.6
  # 日历库
  table_calendar: ^3.3.0

  # 路由
#  go_router: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.2 # windows/linux 桌面端调试用

flutter:
  uses-material-design: true
  # 字体
  fonts:
    - family: FASolid
      fonts:
        - asset: assets/fonts/icon/f_a_7_solid_900.otf
    - family: FABrands
      fonts:
        - asset: assets/fonts/icon/f_a_7_brands_regular_400.otf
    - family: FARegular
      fonts:
        - asset: assets/fonts/icon/f_a_7_regular_400.otf

icon_fonts:
  - family: FaSolidIcons
    outputFile: lib/screens/commons/icons/fa_solid_icons.g.dart
    naming: snake
    className: FaSolidIcons
  - family: FABrands
    outputFile: lib/screens/commons/icons/fa_brands_icons.g.dart
    naming: snake
    className: FaBrandsIcons
  - family: FARegular
    outputFile: lib/screens/commons/icons/fa_regular_icons.g.dart
    naming: snake
    className: FaRegularIcons

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/favicon.png"
  # Android 自适应图标（可选，效果更好）
  adaptive_icon_background: "#FFFFFF"   # 背景层
  adaptive_icon_foreground: "assets/icon/favicon.png"   # 前景层
  adaptive_icon_foreground_inset: 12 #默认16，调小=图标变大，调大=变小
  min_sdk_android: 21