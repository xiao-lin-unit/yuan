name: yuan
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  # ── SDK ──────────────────────────────────────────────────────
  flutter:
    sdk: flutter
  # 框架本地化委托（Material / Widgets / Cupertino），
  # 见 lib/app_locale.dart；与 intl ^0.20.3 的约束一致。
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # ── UI 组件（第三方，不吃 ThemeData）─────────────────────────
  fl_chart: ^1.3.1          # 图表：分析页趋势 / 占比
  table_calendar: ^3.3.0    # 日历：月视图打点

  # ── 图片与文件 ───────────────────────────────────────────────
  image_picker: ^1.2.4
  path: ^1.9.1
  path_provider: ^2.1.6

  # ── 国际化 ───────────────────────────────────────────────────
  intl: ^0.20.3            # 与 table_calendar / flutter_localizations 同步

  # ── 状态 / 持久化 ────────────────────────────────────────────
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.6

  # ── 路由 ─────────────────────────────────────────────────────
  go_router: ^18.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.2 # windows/linux 桌面端调试用

flutter:
  uses-material-design: true
  # 字体
  fonts:
    - family: FASolid
      fonts:
        - asset: assets/fonts/icon/f_a_7_solid_900.otf
    - family: FABrands
      fonts:
        - asset: assets/fonts/icon/f_a_7_brands_regular_400.otf
    - family: FARegular
      fonts:
        - asset: assets/fonts/icon/f_a_7_regular_400.otf

icon_fonts:
  - family: FaSolidIcons
    outputFile: lib/screens/commons/icons/fa_solid_icons.g.dart
    naming: snake
    className: FaSolidIcons
  - family: FABrands
    outputFile: lib/screens/commons/icons/fa_brands_icons.g.dart
    naming: snake
    className: FaBrandsIcons
  - family: FARegular
    outputFile: lib/screens/commons/icons/fa_regular_icons.g.dart
    naming: snake
    className: FaRegularIcons

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/favicon.png"
  # Android 自适应图标（可选，效果更好）
  adaptive_icon_background: "#FFFFFF"   # 背景层
  adaptive_icon_foreground: "assets/icon/favicon.png"   # 前景层
  adaptive_icon_foreground_inset: 12 #默认16，调小=图标变大，调大=变小
  min_sdk_android: 21